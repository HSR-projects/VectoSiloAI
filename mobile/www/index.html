<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IncogniAI</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0b0f;
        color: #e8e8ea;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .wrap { padding: 24px; }
      .dot {
        width: 44px;
        height: 44px;
        margin: 0 auto 18px;
        border-radius: 50%;
        border: 3px solid rgba(124, 58, 237, 0.25);
        border-top-color: #7c3aed;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
      p { color: #9a9aa2; font-size: 14px; margin: 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="dot"></div>
      <h1>Incogni<span style="color:#7c3aed">AI</span></h1>
      <p>Connecting…</p>
    </div>
  </body>
</html>

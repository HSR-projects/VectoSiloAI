<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>VectoSiloBlock Code</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{height:100%;width:100%;overflow:hidden}
body{background:#0c0c0f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.header{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#e0e0e0;padding:8px 16px;border-bottom:2px solid #b388ff;font-size:14px;z-index:10;position:relative}
.header .logo{font-weight:800;font-size:18px;background:linear-gradient(90deg,#b388ff,#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .logo .k{background:linear-gradient(90deg,#e0e0e0,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .actions{display:flex;gap:6px;align-items:center}
.header button{background:#2a2a3e;border:1px solid #3a3a5e;color:#e0e0e0;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:all 0.2s}
.header button:hover{background:#3a3a5e;border-color:#b388ff}
.header button.primary{background:linear-gradient(135deg,#b388ff,#7c4dff);color:#fff;border:none;font-weight:600}
.header button.primary:hover{background:linear-gradient(135deg,#9c6eff,#651fff)}
.header button.primary:disabled{opacity:0.5;cursor:default}
#root{height:calc(100% - 41px)}
.ai-panel{display:none;position:absolute;top:50px;right:12px;z-index:20;flex-direction:column;gap:8px;background:#1a1a2e;border:1px solid #b388ff;border-radius:8px;padding:12px;width:340px;box-shadow:0 8px 32px rgba(0,0,0,0.6)}
.ai-panel.open{display:flex}
.ai-panel textarea{background:#0c0c0f;border:1px solid #2a2a3e;border-radius:4px;color:#e0e0e0;padding:8px;font-size:13px;min-height:60px;resize:vertical;font-family:inherit;outline:none}
.ai-panel textarea:focus{border-color:#b388ff}
.ai-panel .label{font-size:11px;color:#888;margin-bottom:2px}
.result-link{color:#b388ff;font-size:12px;cursor:pointer;text-decoration:underline}
.result-link:hover{color:#9c6eff}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><span class="k">VectoSilo</span>Block</div>
  <div class="actions">
    <button class="primary" onclick="toggleAI()">AI</button>
    <button onclick="showHelp()">?</button>
  </div>
</div>
<div class="ai-panel" id="aiPanel">
  <div class="label">Describe what you want to build:</div>
  <textarea id="aiPrompt" placeholder="e.g. make a cat chase a mouse and score points"></textarea>
  <button class="primary" id="aiBtn" onclick="aiGenerate()" style="width:100%">Generate &amp; Download</button>
  <div id="aiResult" style="font-size:12px;color:#888;min-height:18px"></div>
</div>
<div id="root"></div>
<script>
function toggleAI() {
  document.getElementById('aiPanel').classList.toggle('open');
  if (document.getElementById('aiPanel').classList.contains('open')) {
    document.getElementById('aiPrompt').focus();
  }
}

function showHelp() {
  alert('VectoSiloBlock Code — Visual programming with AI\n\n' +
    '• Drag & drop blocks from the palette on the left\n' +
    '• Click the AI button to generate projects from text\n' +
    '• Use File > Load from your computer to open .sb3 files\n' +
    '• Click the green flag to run your project');
}

async function aiGenerate() {
  const prompt = document.getElementById('aiPrompt').value.trim();
  if (!prompt) return;
  const btn = document.getElementById('aiBtn');
  const result = document.getElementById('aiResult');
  btn.disabled = true;
  btn.textContent = 'Generating...';
  result.textContent = 'Contacting AI...';
  try {
    const res = await fetch('/api/vectosiloblocks/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt }),
    });
    if (!res.ok) throw new Error('Generation failed');
    const data = await res.json();
    if (!data.sb3) throw new Error('No project returned');
    
    // Decode base64 to blob and download
    const binary = atob(data.sb3);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vectosiloblocks-project.sb3';
    a.click();
    URL.revokeObjectURL(url);
    result.innerHTML = 'Downloaded! Open the file via File &gt; Load from your computer';
  } catch (e) {
    result.textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate & Download';
  }
}
</script>
<script src="./scratch-gui.js"></script>
</body>
</html>
